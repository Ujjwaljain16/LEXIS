version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Elasticsearch removed (ADR-003): Path D keyword search now uses the
  # in-process bm25s index (src/lexis/indexing/bm25_index.py) instead of a
  # server. No service needed for it -- see docs/ADR.md.

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
