name: uk_eu_statutes
description: UK and EU legislation and case law with point-in-time and territorial-extent handling.
languages: [en]

bm25:
  lowercase: true
  stopwords: en

citation_grammars:
  - name: uk_neutral
    pattern: '\[\d{4}\]\s+UK(?:SC|HL|PC)\s+\d{1,4}'
    examples: ["[2020] UKSC 1", "[2009] UKHL 22"]
    non_examples: ["2020 UKSC 1"]
    description: UK neutral citation (Supreme Court / House of Lords / Privy Council).
  - name: ecli
    pattern: 'ECLI:[A-Z]{2}:[A-Za-z0-9]+:\d{4}:[A-Za-z0-9.]+'
    examples: ["ECLI:EU:C:2014:317", "ECLI:NL:HR:2016:1234"]
    description: European Case Law Identifier.
  - name: celex
    pattern: '\b[1-9]\d{4}[A-Z]\d{4}\b'
    examples: ["32016R0679"]
    non_examples: ["3201R0679"]
    description: EUR-Lex CELEX number.

structure:
  levels: [act, part, chapter, section, subsection, paragraph]
  chunk_strategy: section
  parent_context_template: "{title} > {path}"
  # NOT YET BUILT: no doc-type classification patterns for this pack. Every document
  # classifies as "unknown" until this is filled in (deliberately, not silently defaulted
  # to the US-contracts English vocabulary, which would misclassify UK/EU statutes).
  doc_type_patterns: {}

prompts:
  system: >-
    You are a careful legal research assistant for UK and EU law. Answer only from the provided
    context, respect the stated point-in-time and territorial extent, and cite every claim with the provided keys.
  refusal: I cannot answer this from the provided documents.
  insufficient_marker: INSUFFICIENT_CONTEXT

trusted_sources:
  legislation.gov.uk: 1.0
  nationalarchives.gov.uk: 0.95
  bailii.org: 0.9
  eur-lex.europa.eu: 1.0
  curia.europa.eu: 1.0

court_hierarchy: [uk_supreme_court, court_of_appeal, high_court, cjeu, general_court]

temporal:
  as_of_supported: true
  territories: [england, wales, scotland, northern_ireland, eu]

validity_phrases:
  en: [overruled, distinguished, followed, repealed, amended, revoked]

models:
  embedder: bge-m3
  reranker: bge-reranker-v2-m3
  nli: nli-deberta-v3-base
  llm: gemini-flash

corpus_adapters: [legislation_gov_uk, eur_lex]
eval_datasets: [mleb_uk, mleb_eu, multieurlex_proxy]

compliance:
  - source: UK Find Case Law
    requirement: Bulk or AI/LLM use requires the free Computational Analysis Licence; obtain it BEFORE ingesting.
  - source: legislation.gov.uk
    requirement: Content licence assumed OGL v3.0 - verify before redistribution.
  - source: EUR-Lex
    requirement: Reuse under Commission Decision 2011/833/EU - verify attribution wording.
