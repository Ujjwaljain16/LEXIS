name: CI

on:
  push:
    branches: [main, foundation-remediation]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only torch AND torchvision first, from the same index: sentence-transformers would
      # otherwise resolve the default CUDA build (several GB) on a runner with no GPU, and a PyPI
      # torchvision paired with a CPU torch fails at `import transformers` (torchvision::nms).
      - name: Install CPU torch + torchvision
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev]"

      # One command, same as a user runs from a clean clone: unit tests, zero-hardcoding ratchet,
      # recomputation of the frozen headline numbers, and the results figure.
      - name: make repro
        run: make repro

      - name: Compliance register is up to date
        run: python scripts/render_compliance.py --check

  docker:
    # Proves the serving image builds from a clean clone (nothing is pushed or run).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lexis-api .
      - name: Smoke test (imports the full stack and serves /v2/health and the UI)
        run: |
          docker run -d --name lexis -p 7860:7860 -e AUTH_DISABLED=true lexis-api
          for i in $(seq 1 30); do curl -sf localhost:7860/v2/health && break || sleep 2; done
          curl -sf localhost:7860/v2/health
          curl -sf localhost:7860/ | grep -q "<title>LEXIS</title>"
          docker logs lexis | tail -20
